<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Taco tres salsas">
  <!-- Fondo: transparente (para header oscuro de la web) -->

  <!-- VERDE: tortilla delantera / relleno — gran arco que domina el centro-derecha -->
  <path d="M 78 252 C 48 164 96 92 186 90 C 268 88 314 148 302 238 C 296 300 148 318 78 252 Z"
        fill="#2A9D8F" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"/>

  <!-- ROJO: tortilla trasera / domo superior -->
  <path d="M 122 156 C 128 76 214 62 256 112 C 290 152 276 196 250 210 C 208 194 142 190 122 156 Z"
        fill="#C1121F" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"/>

  <!-- TURQUESA: lóbulo abajo-izquierda -->
  <path d="M 74 250 C 60 272 70 298 100 308 C 132 317 154 298 154 272 C 154 240 110 230 74 250 Z"
        fill="#1B7A8C" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"/>

  <!-- GOTA verde cayendo (borde inferior derecho del verde) -->
  <path d="M 236 296 C 241 312 244 322 239 332 C 236 338 228 338 226 332 C 219 322 225 306 236 296 Z"
        fill="#2A9D8F"/>

  <!-- GOTA roja cayendo (junto a la verde) -->
  <path d="M 266 286 C 271 302 274 312 269 322 C 266 328 258 328 256 322 C 249 312 255 296 266 286 Z"
        fill="#C1121F"/>
</svg>
